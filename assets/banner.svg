<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .particle {
      animation: float 6s ease-in-out infinite alternate;
    }
    .glow-orb {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .packet {
      animation: streamFlow 4s linear infinite;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.92); opacity: 0.35; }
      100% { transform: scale(1.08); opacity: 0.65; }
    }
    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-8px) translateX(4px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />
  
  <!-- Grid Matrix Overlay -->
  <rect width="1200" height="380" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="glow-orb" transform-origin="200 120">
    <circle cx="200" cy="120" r="140" fill="url(#glowPulse)" />
  </g>
  <g class="glow-orb" transform-origin="1000 240">
    <circle cx="1000" cy="240" r="160" fill="url(#glowPulse)" />
  </g>

  <!-- Animated Data Highway lines in Background -->
  <g opacity="0.35">
    <path d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" />
    <path d="M 50 310 Q 350 360 650 310 T 1150 310" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8,8" />
  </g>

  <!-- High-Speed Data Memory Packets (Floating) -->
  <circle cx="160" cy="80" r="4" fill="#38bdf8" filter="url(#glowEffect)">
    <animate attributeName="cx" values="50;1150" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="310" r="4.5" fill="#c084fc" filter="url(#glowEffect)">
    <animate attributeName="cx" values="1150;50" dur="6.5s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Content Block (Guaranteed Clear Foreground Layer) -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Lightning Icon Pill -->
    <rect x="-140" y="-85" width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="0" y="-63" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5">⚡ SUB-MILLISECOND LATENCY</text>

    <!-- Main Title -->
    <text y="-5" class="title-text" fill="url(#titleGrad)" filter="url(#glowEffect)">High-Speed In-Memory Cache &amp; Key-Value Store</text>

    <!-- Subtitle -->
    <text y="36" class="sub-text">Curated guide to ultra-low latency memory data grids, distributed stores &amp; fast storage engines</text>
  </g>

  <!-- Feature Pills / Badges at bottom -->
  <g transform="translate(200, 260)">
    <!-- Pill 1: Redis / Valkey -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="21" r="7" fill="#ef4444" />
      <text x="42" y="26" class="badge-label">Redis &amp; Valkey Core</text>
    </g>

    <!-- Pill 2: Distributed Data Grids -->
    <g transform="translate(205, 0)">
      <rect width="195" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="21" r="7" fill="#0ea5e9" />
      <text x="42" y="26" class="badge-label">Distributed Data Grids</text>
    </g>

    <!-- Pill 3: Embedded Storage Engines -->
    <g transform="translate(425, 0)">
      <rect width="185" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="21" r="7" fill="#10b981" />
      <text x="42" y="26" class="badge-label">Embedded KV Engines</text>
    </g>

    <!-- Pill 4: Cloud & Serverless Caches -->
    <g transform="translate(635, 0)">
      <rect width="165" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="21" r="7" fill="#a855f7" />
      <text x="42" y="26" class="badge-label">Managed Cloud</text>
    </g>
  </g>

  <!-- Subtle border outline -->
  <rect x="0.5" y="0.5" width="1199" height="379" rx="16" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />
</svg>
